<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7f5af0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2cb67d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2cb67d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="glassblur"><feGaussianBlur stdDeviation="1.2"/></filter>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#93e5c8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <circle cx="180" cy="80" r="180" fill="url(#blob1)" filter="url(#blur1)"/>
  <circle cx="1050" cy="60" r="160" fill="url(#blob3)" filter="url(#blur1)"/>
  <circle cx="950" cy="320" r="200" fill="url(#blob2)" filter="url(#blur2)"/>
  <circle cx="60" cy="330" r="140" fill="url(#blob3)" filter="url(#blur2)"/>

  <!-- glass panel -->
  <rect x="90" y="70" width="1020" height="220" rx="26" fill="url(#panel)" stroke="url(#panelBorder)" stroke-width="1.5"/>
  <rect x="90" y="70" width="1020" height="220" rx="26" fill="#ffffff" opacity="0.02"/>

  <!-- podium glyph, right side, subtle -->
  <g opacity="0.85" transform="translate(870,140)">
    <rect x="0" y="70" width="46" height="70" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
    <rect x="58" y="40" width="46" height="100" rx="8" fill="#ffffff" fill-opacity="0.20" stroke="#ffffff" stroke-opacity="0.5"/>
    <rect x="116" y="90" width="46" height="50" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="81" cy="20" r="14" fill="#ffd166" fill-opacity="0.9"/>
  </g>

  <!-- text -->
  <text x="140" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#titleGrad)" letter-spacing="4">EYFI</text>
  <text x="140" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#e7e9ff" opacity="0.92">Student Earnings &amp; Leaderboard Platform</text>
  <text x="140" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9cdfb" opacity="0.75">React &#8226; FastAPI &#8226; MongoDB &#8226; Tailwind CSS</text>

  <rect x="140" y="266" width="46" height="6" rx="3" fill="#7f5af0"/>
  <rect x="192" y="266" width="46" height="6" rx="3" fill="#2cb67d"/>
  <rect x="244" y="266" width="46" height="6" rx="3" fill="#00d4ff"/>
</svg>
